<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张圆圆 - 个人主页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

        * {
            font-family: 'Noto Sans SC', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 动态背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* 漂浮动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(20px) rotate(-5deg); }
        }

        .float-animation {
            animation: float 6s ease-in-out infinite;
        }

        .float-animation-reverse {
            animation: floatReverse 8s ease-in-out infinite;
        }

        /* 渐变文字 */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 卡片悬浮效果 */
        .card-hover {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-hover:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        /* 闪光效果 */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        .shimmer {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            background-size: 1000px 100%;
            animation: shimmer 3s infinite;
        }

        /* 头像光环 */
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 0 0 40px rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 255, 255, 0.8), 0 0 80px rgba(255, 255, 255, 0.5); }
        }

        .avatar-glow {
            animation: glow 3s ease-in-out infinite;
        }

        /* 入场动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }

        /* 按钮悬浮效果 */
        .btn-glow {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-glow:hover::before {
            left: 100%;
        }

        /* 标签云 */
        .tag {
            transition: all 0.3s ease;
        }

        .tag:hover {
            transform: scale(1.1) rotate(-3deg);
        }

        /* 装饰圆点 */
        .decoration-dot {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- 装饰元素 -->
    <div class="decoration-dot w-20 h-20 bg-white top-10 left-10 float-animation"></div>
    <div class="decoration-dot w-32 h-32 bg-pink-300 top-1/4 right-20 float-animation-reverse"></div>
    <div class="decoration-dot w-16 h-16 bg-purple-300 bottom-20 left-1/4 float-animation"></div>
    <div class="decoration-dot w-24 h-24 bg-blue-300 bottom-10 right-10 float-animation-reverse"></div>

    <!-- 主卡片 -->
    <div class="relative z-10 max-w-4xl w-full">

        <!-- 顶部装饰条 -->
        <div class="flex justify-between items-center mb-6 fade-in-up">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-red-400"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                <div class="w-3 h-3 rounded-full bg-green-400"></div>
            </div>
            <div class="text-white text-sm font-light tracking-wider">
                <i class="fa fa-globe mr-2"></i>个人主页 · Personal Page
            </div>
        </div>

        <!-- 主内容卡片 -->
        <div class="bg-white/95 backdrop-blur-lg rounded-3xl shadow-2xl overflow-hidden card-hover">

            <!-- 顶部横幅 -->
            <div class="relative h-48 bg-gradient-to-r from-purple-500 via-pink-500 to-blue-500 overflow-hidden">
                <div class="absolute inset-0 shimmer"></div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="text-white text-center">
                        <i class="fa fa-star text-yellow-300 text-2xl mx-2"></i>
                        <i class="fa fa-heart text-pink-200 text-2xl mx-2"></i>
                        <i class="fa fa-diamond text-blue-200 text-2xl mx-2"></i>
                        <i class="fa fa-star text-yellow-300 text-2xl mx-2"></i>
                    </div>
                </div>
                <!-- 波浪 -->
                <svg class="absolute bottom-0 w-full" viewBox="0 0 1440 100" preserveAspectRatio="none">
                    <path d="M0,50 C240,100 480,0 720,50 C960,100 1200,0 1440,50 L1440,100 L0,100 Z" fill="white" fill-opacity="0.95"></path>
                </svg>
            </div>

            <!-- 头像区域 -->
            <div class="relative -mt-20 flex justify-center fade-in-up delay-1">
                <div class="relative">
                    <div class="w-40 h-40 rounded-full bg-gradient-to-br from-purple-400 to-pink-400 flex items-center justify-center text-white text-6xl font-black shadow-2xl avatar-glow border-4 border-white">
                        圆
                    </div>
                    <div class="absolute -bottom-2 -right-2 bg-green-400 w-8 h-8 rounded-full border-4 border-white flex items-center justify-center">
                        <i class="fa fa-check text-white text-xs"></i>
                    </div>
                </div>
            </div>

            <!-- 基本信息 -->
            <div class="text-center px-8 pt-6 pb-4 fade-in-up delay-2">
                <h1 class="text-5xl font-black mb-3 gradient-text">张圆圆</h1>
                <p class="text-gray-500 text-lg mb-2">
                    <i class="fa fa-id-card mr-2 text-purple-500"></i>学号: <span class="font-bold text-gray-700">526</span>
                </p>
                <div class="flex items-center justify-center space-x-2 text-sm text-gray-500">
                    <i class="fa fa-map-marker text-pink-500"></i>
                    <span>中国 · 高级网页设计课程</span>
                </div>
            </div>

            <!-- 标签云 -->
            <div class="flex flex-wrap justify-center gap-3 px-8 pb-6 fade-in-up delay-2">
                <span class="tag px-4 py-2 bg-gradient-to-r from-purple-100 to-pink-100 text-purple-700 rounded-full text-sm font-medium cursor-pointer">
                    <i class="fa fa-code mr-1"></i>Web开发
                </span>
                <span class="tag px-4 py-2 bg-gradient-to-r from-blue-100 to-cyan-100 text-blue-700 rounded-full text-sm font-medium cursor-pointer">
                    <i class="fa fa-paint-brush mr-1"></i>前端设计
                </span>
                <span class="tag px-4 py-2 bg-gradient-to-r from-green-100 to-emerald-100 text-green-700 rounded-full text-sm font-medium cursor-pointer">
                    <i class="fa fa-leaf mr-1"></i>UI/UX
                </span>
                <span class="tag px-4 py-2 bg-gradient-to-r from-yellow-100 to-orange-100 text-orange-700 rounded-full text-sm font-medium cursor-pointer">
                    <i class="fa fa-lightbulb-o mr-1"></i>创意设计
                </span>
            </div>

            <!-- 信息卡片网格 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 px-8 pb-8 fade-in-up delay-3">

                <!-- 卡片 1 -->
                <div class="bg-gradient-to-br from-purple-50 to-pink-50 rounded-2xl p-5 card-hover cursor-pointer">
                    <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-pink-500 rounded-xl flex items-center justify-center mb-3">
                        <i class="fa fa-graduation-cap text-white text-xl"></i>
                    </div>
                    <h3 class="font-bold text-gray-800 mb-1">学业</h3>
                    <p class="text-sm text-gray-600">高级网页设计 · 学习探索中</p>
                    <div class="mt-3 h-1 bg-purple-200 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-purple-500 to-pink-500 rounded-full" style="width: 75%"></div>
                    </div>
                </div>

                <!-- 卡片 2 -->
                <div class="bg-gradient-to-br from-blue-50 to-cyan-50 rounded-2xl p-5 card-hover cursor-pointer">
                    <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-xl flex items-center justify-center mb-3">
                        <i class="fa fa-trophy text-white text-xl"></i>
                    </div>
                    <h3 class="font-bold text-gray-800 mb-1">目标</h3>
                    <p class="text-sm text-gray-600">打造精美网页体验</p>
                    <div class="mt-3 h-1 bg-blue-200 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-blue-500 to-cyan-500 rounded-full" style="width: 60%"></div>
                    </div>
                </div>

                <!-- 卡片 3 -->
                <div class="bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl p-5 card-hover cursor-pointer">
                    <div class="w-12 h-12 bg-gradient-to-br from-green-500 to-emerald-500 rounded-xl flex items-center justify-center mb-3">
                        <i class="fa fa-heart text-white text-xl"></i>
                    </div>
                    <h3 class="font-bold text-gray-800 mb-1">兴趣</h3>
                    <p class="text-sm text-gray-600">编程 · 设计 · 创造</p>
                    <div class="mt-3 h-1 bg-green-200 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-green-500 to-emerald-500 rounded-full" style="width: 90%"></div>
                    </div>
                </div>

            </div>

            <!-- 分隔线 -->
            <div class="mx-8 border-t border-gray-100"></div>

            <!-- 联系方式 -->
            <div class="px-8 py-6 fade-in-up delay-4">
                <h3 class="text-center text-gray-700 font-bold mb-4 flex items-center justify-center">
                    <i class="fa fa-link mr-2 text-purple-500"></i>联系方式
                </h3>
                <div class="flex justify-center space-x-4 flex-wrap gap-3">
                    <button class="btn-glow flex items-center space-x-2 px-5 py-3 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-xl shadow-lg hover:shadow-xl">
                        <i class="fa fa-envelope"></i>
                        <span class="text-sm font-medium">邮箱</span>
                    </button>
                    <button class="btn-glow flex items-center space-x-2 px-5 py-3 bg-gradient-to-r from-green-500 to-green-600 text-white rounded-xl shadow-lg hover:shadow-xl">
                        <i class="fa fa-wechat"></i>
                        <span class="text-sm font-medium">微信</span>
                    </button>
                    <button class="btn-glow flex items-center space-x-2 px-5 py-3 bg-gradient-to-r from-purple-500 to-purple-600 text-white rounded-xl shadow-lg hover:shadow-xl">
                        <i class="fa fa-github"></i>
                        <span class="text-sm font-medium">GitHub</span>
                    </button>
                    <button class="btn-glow flex items-center space-x-2 px-5 py-3 bg-gradient-to-r from-pink-500 to-pink-600 text-white rounded-xl shadow-lg hover:shadow-xl">
                        <i class="fa fa-instagram"></i>
                        <span class="text-sm font-medium">微博</span>
                    </button>
                </div>
            </div>

            <!-- 底部统计 -->
            <div class="bg-gradient-to-r from-purple-500 via-pink-500 to-blue-500 px-8 py-6 fade-in-up delay-4">
                <div class="grid grid-cols-3 gap-4 text-center text-white">
                    <div>
                        <div class="text-3xl font-black">526</div>
                        <div class="text-xs opacity-80 mt-1">学号</div>
                    </div>
                    <div class="border-x border-white/30">
                        <div class="text-3xl font-black">∞</div>
                        <div class="text-xs opacity-80 mt-1">可能性</div>
                    </div>
                    <div>
                        <div class="text-3xl font-black">100%</div>
                        <div class="text-xs opacity-80 mt-1">用心</div>
                    </div>
                </div>
            </div>

        </div>

        <!-- 底部签名 -->
        <div class="text-center mt-6 text-white/80 text-sm fade-in-up delay-4">
            <i class="fa fa-copyright"></i> 2026 · Made with <i class="fa fa-heart text-pink-300 mx-1"></i> by 张圆圆
        </div>

    </div>

    <script>
        // 鼠标移动视差效果
        document.addEventListener('mousemove', (e) => {
            const dots = document.querySelectorAll('.decoration-dot');
            const x = (e.clientX / window.innerWidth - 0.5) * 30;
            const y = (e.clientY / window.innerHeight - 0.5) * 30;

            dots.forEach((dot, index) => {
                const factor = (index + 1) * 0.5;
                dot.style.transform = `translate(${x * factor}px, ${y * factor}px)`;
            });
        });

        // 按钮点击反馈
        document.querySelectorAll('.btn-glow').forEach(btn => {
            btn.addEventListener('click', function() {
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });
    </script>

</body>
</html>
