<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>526 张圆圆</title>
    <style>
        h3{
            color: red;
        }
        p{
            color: blue;
        }
        /* 标签选择器，选择器名称为标签 */
        #box{
            width: 500px;
            height: 500px;
            background-color: #ccc;
        }
        /* id选择器， 以#开始 唯一 */
        .n1{
            color: #7A9;
        }
        /* 扩展1：h2黑底白字 */
        h2{
            background-color: #000;
            color: #fff;
            padding: 10px;
        }
        /* 扩展2：名字每个字不同颜色 */
        .n2{
            color: orange;
        }
        .n3{
            color: purple;
        }
        /* 扩展3：选择器三个字是白色 */
        h3 .selector{
            color: #fff;
        }
        /* 扩展4：学号盒子 */
        #student-id{
            width: 400px;
            height: 80px;
            background-color: #ffcc00;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            line-height: 80px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>层叠样式表</h2>
    <div id="box">
        <h3>CSS<span class="selector">选择器</span></h3>
        <p><span class="n1">张</span><span class="n2">圆</span><span class="n3">圆</span></p>
        <p>CSS属性</p>
    </div>

    <!-- 扩展4：学号盒子 -->
    <div id="student-id">24001010526</div>

    <!--扩展：
     1.h2黑底白字
     2.你的名字每个字不同颜色，在同一行
     3.选择器三个字是白色
     4.新加一个盒子，盒子里的文字是你的学号，盒子有宽高背景
    -->
</body>
</html>
