    <style>
        /* ===== 全局公共CSS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

        }

        .zyy-container {

            margin: 0 auto;
        }

        a {

        }

        .zyy-header {

        }

        .zyy-header p {

        }

        .zyy-header code {

            padding: 1px 8px;
            font-family: Consolas, monospace;
            font-size: 13px;
        }

        /* ===== 状态栏 + 统计 ===== */
        .zyy-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;

            border-radius: 14px;

        .zyy-search {

        .zyy-search:focus {

        /* ===== 用户卡片网格 ===== */
        .zyy-user-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .zyy-user-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px 22px;
            box-shadow: 0 6px 20px rgba(35, 42, 69, 0.08);
            border-top: 4px solid #4c6ef5;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .zyy-user-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(76, 110, 245, 0.22);
        }

        .zyy-user-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .zyy-avatar {
            flex: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: #4c6ef5;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            line-height: 46px;
        }

        .zyy-user-top h3 {
            font-size: 16px;
        }

        .zyy-user-top p {
            font-size: 12px;
            color: #8b91b0;
        }

        .zyy-user-info {
            font-size: 13px;
            color: #565d7d;
        }

        .zyy-user-info li {
            display: flex;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px dashed #eef0f8;
        }

        .zyy-user-info li:last-child {
            border-bottom: none;
        }

        .zyy-info-icon {
            flex: none;
            width: 20px;
            color: #4c6ef5;
            text-align: center;
        }

        .zyy-user-info a {
            word-break: break-all;
        }

        /* ===== 展开详情 ===== */
        .zyy-detail {
            display: none;
            margin-top: 12px;
            border-top: 1px solid #eef0f8;
            padding-top: 12px;
            font-size: 12px;
        }

        .zyy-user-card.zyy-open .zyy-detail {
            display: block;
        }

        .zyy-detail h4 {
            font-size: 13px;
            color: #4c6ef5;
            margin-bottom: 4px;
        }

        .zyy-detail p {
            color: #6f7694;
            margin-bottom: 8px;
        }

        .zyy-detail .zyy-code {
            background: #1b2140;
            color: #cdd6f8;
            border-radius: 8px;
            padding: 10px 12px;
            font-family: Consolas, monospace;
            font-size: 11px;
            line-height: 1.7;
            white-space: pre;
            overflow-x: auto;
        }

        /* ===== 加载动画 ===== */
        .zyy-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #c7d0f5;
            border-top-color: #4c6ef5;
            border-radius: 50%;
            vertical-align: -2px;
            animation: zyy_spin 0.8s linear infinite;
        }

        @keyframes zyy_spin {
            to { transform: rotate(360deg); }
        }

        .zyy-back {
            display: inline-block;
            margin-top: 26px;
            font-size: 14px;
        }

        @media (max-width: 860px) {
            .zyy-user-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 560px) {
            .zyy-user-grid {
                grid-template-columns: 1fr;
            }

            .zyy-search {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="zyy-container">

            <p>数据来源：<code>http://jsonplaceholder.typicode.com/users</code>（CORS 跨域可访问）· 张圆圆</p>

        <div class="zyy-toolbar">
            <span class="zyy-status zyy-loading" id="zyy_status">
                <span class="zyy-spinner"></span> 正在请求接口数据…

            <span class="zyy-stats" id="zyy_stats" style="display: none;"></span>
            <input type="text" class="zyy-search" id="zyy_search" placeholder="按姓名 / 用户名 / 城市筛选…" disabled>

        <section class="zyy-user-grid" id="zyy_userGrid"></section>

        <a class="zyy-back" href="./index.html">← 返回首页</a>
    </div>

    <script>
        var zyy_apiUrl = "http://jsonplaceholder.typicode.com/users";
        var zyy_users = []; // 保存接口返回的用户数组

        // 内置演示数据：内容与接口返回一致，仅在 file:// 打开被浏览器拦截时兜底使用

              "address": { "street": "Kulas Light", "suite": "Apt. 556", "city": "Gwenborough", "zipcode": "92998-3874", "geo": { "lat": "-37.3159", "lng": "81.1496" } },
              "phone": "1-770-736-8031 x56442", "website": "hildegard.org",
              "company": { "name": "Romaguera-Crona", "catchPhrase": "Multi-layered client-server", "bs": "harness real-time e-markets" } },
            { "id": 2, "name": "Ervin Howell", "username": "Antonette", "email": "Shanna@melissa.tv",

            { "id": 3, "name": "Clementine Bauch", "username": "Samantha", "email": "Nathan@yesenia.net",
              "address": { "street": "Douglas Extension", "suite": "Suite 847", "city": "McKenziehaven", "zipcode": "53290-3431", "geo": { "lat": "-68.6102", "lng": "-47.0653" } },

              "company": { "name": "Romaguera-Jacobson", "catchPhrase": "Face to face bifurcated interface", "bs": "e-enable strategic applications" } },
            { "id": 4, "name": "Patricia Lebsack", "username": "Karianne", "email": "Julianne.OConner@kory.org",
              "address": { "street": "Hoeger Mall", "suite": "Apt. 692", "city": "South Elvis", "zipcode": "53919-4257", "geo": { "lat": "29.4572", "lng": "-164.2990" } },
              "phone": "493-170-9623 x156", "website": "kale.biz",
              "company": { "name": "Robel-Corkery", "catchPhrase": "Multi-tiered zero tolerance productivity", "bs": "transition cutting-edge web services" } },
            { "id": 5, "name": "Chelsey Dietrich", "username": "Kamren", "email": "Lucio_Hettinger@annie.ca",
              "address": { "street": "Skiles Walks", "suite": "Suite 351", "city": "Roscoeview", "zipcode": "33263", "geo": { "lat": "-31.8129", "lng": "62.5342" } },
              "phone": "(254)954-1289", "website": "demarco.info",
              "company": { "name": "Keebler LLC", "catchPhrase": "User-centric fault-tolerant solution", "bs": "revolutionize end-to-end systems" } },
            { "id": 6, "name": "Mrs. Dennis Schulist", "username": "Leopoldo_Corkery", "email": "Karley_Dach@jasper.info",

              "address": { "street": "Ellsworth Summit", "suite": "Suite 729", "city": "Aliyaview", "zipcode": "45169", "geo": { "lat": "-14.3998", "lng": "-120.7677" } },
              "phone": "586.493.6943 x140", "website": "jacynthe.com",
              "company": { "name": "Abernathy Group", "catchPhrase": "Implemented secondary concept", "bs": "e-enable extensible e-tailers" } },
            { "id": 9, "name": "Glenna Reichert", "username": "Delphine", "email": "Chaim_McDermott@dana.io",
              "address": { "street": "Dayna Park", "suite": "Suite 449", "city": "Bartholomebury", "zipcode": "76495-3109", "geo": { "lat": "24.6463", "lng": "-168.8889" } },
              "phone": "(775)976-6794 x41206", "website": "conrad.com",
              "company": { "name": "Yost and Sons", "catchPhrase": "Assimilated incremental execution", "bs": "switch vertical schema" } },
            { "id": 10, "name": "Clementina DuBuque", "username": "Moriah.Stanton", "email": "Rey.Padberg@karina.biz",
              "address": { "street": "Kattie Turnpike", "suite": "Suite 198", "city": "Lebsackbury", "zipcode": "31428-2261", "geo": { "lat": "-38.2386", "lng": "57.2232" } },
              "phone": "024-648-3804", "website": "ambrose.net",
              "company": { "name": "Hoeger LLC", "catchPhrase": "Centralized empowering task-force", "bs": "target end-to-end models" } }
        ];

        // file:// 协议下浏览器会拦截 fetch 跨域请求，改用内置演示数据正常展示
        if (window.location.protocol === "file:") {
            zyy_showStatus("⚠ 当前通过 file:// 直接打开，浏览器拦截了跨域请求，已改用内置演示数据。通过本地服务器访问（如 http://localhost:8765/17-2.html）即可加载接口真实数据", "zyy-error");
            zyy_users = zyy_fallbackUsers;
            zyy_showStats();
            zyy_renderUsers(zyy_users);
            document.getElementById("zyy_search").disabled = false;
        } else {
            zyy_runFetch();
        }

        // ===== fetch 获取跨域接口数据 =====
        function zyy_runFetch() {
            fetch(zyy_apiUrl)
            .then(function (zyy_res) {
                // HTTP 状态码检查：2xx 才继续，否则抛出错误
                if (!zyy_res.ok) {
                    throw new Error("HTTP 状态码 " + zyy_res.status);
                }
                return zyy_res.json(); // 响应体解析为 JSON
            })
            .then(function (zyy_data) {
                zyy_users = zyy_data;
                zyy_showStatus("✔ 加载成功，共获取 " + zyy_users.length + " 位用户数据", "");
                zyy_showStats();
                zyy_renderUsers(zyy_users);
                document.getElementById("zyy_search").disabled = false;
            })
            .catch(function (zyy_err) {
                zyy_showStatus("✘ 加载失败：" + zyy_err.message + "（请检查网络后刷新重试）", "zyy-error");
            });
        }

        // ===== 状态提示 =====
        function zyy_showStatus(zyy_text, zyy_cls) {
            var zyy_el = document.getElementById("zyy_status");
            zyy_el.textContent = zyy_text;
            zyy_el.className = "zyy-status " + (zyy_cls || "");
        }

        // ===== 统计信息：人数 + 城市数 =====
        function zyy_showStats() {
            var zyy_citySet = {};
            for (var zyy_i = 0; zyy_i < zyy_users.length; zyy_i++) {
                zyy_citySet[zyy_users[zyy_i].address.city] = true;
            }
            var zyy_cityCount = 0;
            for (var zyy_city in zyy_citySet) {
                zyy_cityCount++;
            }
            document.getElementById("zyy_stats").style.display = "flex";
            document.getElementById("zyy_stats").textContent =
                "用户 " + zyy_users.length + " 位 · 城市 " + zyy_cityCount + " 座";
        }

        // ===== 渲染用户卡片列表 =====
        function zyy_renderUsers(zyy_list) {
            var zyy_html = "";
            for (var zyy_i = 0; zyy_i < zyy_list.length; zyy_i++) {
                var zyy_u = zyy_list[zyy_i];
                var zyy_initial = zyy_u.name.charAt(0).toUpperCase();
                zyy_html += '<article class="zyy-user-card" onclick="zyy_toggleCard(this)">';
                zyy_html += '<div class="zyy-user-top">';
                zyy_html += '<span class="zyy-avatar">' + zyy_initial + "</span>";
                zyy_html += "<div><h3>" + zyy_u.name + "</h3><p>@" + zyy_u.username + " · No." + zyy_u.id + "</p></div>";
                zyy_html += "</div>";
                zyy_html += '<ul class="zyy-user-info">';
                zyy_html += '<li><span class="zyy-info-icon">✉</span><a href="mailto:' + zyy_u.email + '">' + zyy_u.email + "</a></li>";
                zyy_html += '<li><span class="zyy-info-icon">☎</span><span>' + zyy_u.phone + "</span></li>";
                zyy_html += '<li><span class="zyy-info-icon">⌂</span><a href="http://' + zyy_u.website + '" target="_blank">' + zyy_u.website + "</a></li>";
                zyy_html += '<li><span class="zyy-info-icon">⚑</span><span>' + zyy_u.address.city + "</span></li>";
                zyy_html += '<li><span class="zyy-info-icon">ⓒ</span><span>' + zyy_u.company.name + "</span></li>";
                zyy_html += "</ul>";
                // 点击展开：完整地址 + 公司口号 + 原始 JSON
                zyy_html += '<div class="zyy-detail">';
                zyy_html += "<h4>完整地址</h4><p>" + zyy_u.address.suite + "，" + zyy_u.address.street +
                    " 街，邮编 " + zyy_u.address.zipcode +
                    "（经度 " + zyy_u.address.geo.lng + "，纬度 " + zyy_u.address.geo.lat + "）</p>";
                zyy_html += "<h4>公司口号</h4><p>" + zyy_u.company.catchPhrase + "（业务：" + zyy_u.company.bs + "）</p>";
                zyy_html += "<h4>原始 JSON</h4>";
                zyy_html += '<div class="zyy-code">' + JSON.stringify(zyy_u, null, 2) + "</div>";
                zyy_html += "</div>";
                zyy_html += "</article>";
            }
            document.getElementById("zyy_userGrid").innerHTML = zyy_html;
        }

        // ===== 点击卡片展开 / 收起详情 =====
        function zyy_toggleCard(zyy_card) {
            zyy_card.className = zyy_card.className === "zyy-user-card" ? "zyy-user-card zyy-open" : "zyy-user-card";
        }

        // ===== 搜索筛选 =====
        document.getElementById("zyy_search").addEventListener("input", function () {
            var zyy_kw = this.value.trim().toLowerCase();
            var zyy_filtered = [];
            for (var zyy_i = 0; zyy_i < zyy_users.length; zyy_i++) {
                var zyy_u = zyy_users[zyy_i];
                var zyy_text = (zyy_u.name + zyy_u.username + zyy_u.address.city).toLowerCase();
                if (zyy_text.indexOf(zyy_kw) !== -1) {
                    zyy_filtered.push(zyy_u);
                }
            }
            zyy_renderUsers(zyy_filtered);
        });
    </script>
</body>
</html>
