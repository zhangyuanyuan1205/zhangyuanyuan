<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css3</title>
    <style>
        .main{
            display: flex;
            flex-wrap: wrap;
            margin: 10px;
        }
        .box{
            width: 150px;
            height: 150px;
            border: 1px solid #ccc;
            margin: 10px;
            display: flex;
            /*水平垂直居中*/
            justify-content: center;
            align-items: center;
            font-size: 40px;
            transition: all 0.6s;
            box-sizing: border-box;
            /* width：包含padding和border */
        }
        .box:first-child:hover{
            background: red;
            color: white;
            font-size: 140px;
        }
        .box:nth-child(2):hover{
            border-radius: 50%;
            border-width: 10px;
        }
        .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px #ccc;
        }
        .box:nth-of-type(4):hover{
            text-shadow: 100px 10px 10px #ccc;
        }
        .box:nth-of-type(5):hover{
            /*线性渐变*/
            background: linear-gradient(#000,#ccc,#fff);
        }
        .box:nth-of-type(5)+.box{
            /*径向渐变*/
            background: radial-gradient(#fff,#ccc,#000);
        }
        /*相邻兄弟选择器
         +后面的那一个兄弟
         ~后面的所有兄弟
        */
        .box:nth-of-type(7):hover{
            transform: scale(0.5);
        }
        .box:nth-child(8):hover{
            transform: translateX(-150px);
        }
        .box:nth-child(9):hover{
            transform: rotateZ(-180deg);
        }
        .box:nth-child(10):hover{
            transform: skewX(20deg) translateY(50px);
        }
        .box:nth-last-child(2):hover::before{
            /*内部的最前面的元素*/
            content: "*";
            color: red;
        }

        /*扩展1：第十二个盒子，鼠标在上面时显示自己的名字，要求名字深色背景白色文字，水平垂直居中*/
        /* 用 ::after 在 "12" 数字后面一起出现，单行 */
        .box:nth-child(12)::after{
            content: "张圆圆";
            background: #333;                  /* 深色背景 */
            color: #fff;                      /* 白色文字 */
            font-size: 14px;                  /* 字号小一点 */
            padding: 3px 8px;
            margin-left: 6px;
            border-radius: 4px;
            display: inline-block;
            white-space: nowrap;              /* 单行，不换行 */
            opacity: 0;                       /* 默认隐藏 */
            transition: opacity 0.4s;
        }
        .box:nth-child(12):hover::after{
            opacity: 1;                       /* 悬停时显示，紧跟在 12 后面 */
        }

        .box:nth-child(3n):hover{
            border: 3px solid red;
        }

        /*偶数:even,奇数:odd*/
        /*扩展2：鼠标在偶数盒子上时，自定义效果*/
        .box:nth-child(even):hover{
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);  /* 粉色渐变背景 */
            color: #fff;
            border: 2px dashed #ff6b9d;                            /* 虚线粉色 */
            border-radius: 20px;                                   /* 圆角 */
            box-shadow: 0 0 20px rgba(255,107,157,0.6);          /* 粉色发光阴影 */
            transform: rotate(5deg) scale(1.05);                  /* 微旋转+放大 */
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="box"><span class="num">1</span></div>
        <div class="box"><span class="num">2</span></div>
        <div class="box"><span class="num">3</span></div>
        <div class="box"><span class="num">4</span></div>
        <div class="box"><span class="num">5</span></div>
        <div class="box"><span class="num">6</span></div>
        <div class="box"><span class="num">7</span></div>
        <div class="box"><span class="num">8</span></div>
        <div class="box"><span class="num">9</span></div>
        <div class="box"><span class="num">10</span></div>
        <div class="box"><span class="num">11</span></div>
        <div class="box"><span class="num">12</span></div>
    </div>
</body>
</html>
