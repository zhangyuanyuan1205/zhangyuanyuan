<!DOCTYPE html>

<head>

    <title>16-3 分类列表</title>
    <link rel="stylesheet" href="font/iconfont.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #f4f5f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #333;
            line-height: 1.6;
        }

        /* 分类卡片：模拟图片中的白色圆角面板 */
        .zyy_panel {
            width: 400px;
            max-width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 24px 26px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .zyy_panel h2 {
            font-size: 20px;
            color: #222;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        /* 分类行 */
        .zyy_row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 6px;
            border-radius: 8px;
            font-size: 15px;
            transition: background 0.2s;
        }

        .zyy_row:hover {
            background: #fff4ee;
        }

        .zyy_row .iconfont {
            font-size: 20px;
            color: #333;
            flex-shrink: 0;
        }

        /* 橙色促销行 */
        .zyy_hot {
            color: #ff5000;
        }

        .zyy_hot .iconfont {
            color: #ff5000;
            font-size: 22px;
        }

        /* 行内链接与分隔符 */
        .zyy_row a {
            color: #333;
            text-decoration: none;
            transition: color 0.2s;
        }

        .zyy_row a:hover {
            color: #ff5000;
        }

        .zyy_hot a {
            color: #ff5000;
            font-weight: bold;
        }

        .zyy_hot a:hover {
            color: #e64500;
            text-decoration: underline;
        }

        .zyy_sep {
            color: #ccc;
            margin: 0 6px;
        }

        .zyy_hot .zyy_sep {
            color: #ffb596;
        }

        /* 返回首页 */
        .zyy_back {
            display: inline-block;
            margin-top: 24px;
            padding: 8px 20px;
            background: rgba(255, 80, 0, 0.85);
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .zyy_back:hover {
            background: rgba(255, 80, 0, 1);
            transform: translateY(-2px);
        }
    </style>
</head>
