<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 姓名：张圆圆，日期：2026-11-02，功能名称：Promise与async/await异步流程演示（包饺子） -->
    <title>17-6 包饺子异步流程演示</title>
    <style>
        /* ===== 全局公共CSS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: #fdf3ee;
            color: #43302b;
            line-height: 1.7;
            padding: 30px 16px 60px;
        }

        .zyy-container {
            max-width: 980px;
            margin: 0 auto;
        }

        a {
            color: #c0392b;
            text-decoration: none;
        }

        .zyy-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .zyy-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .zyy-header h1 span {
            color: #c0392b;
        }

        .zyy-header p {
            color: #b59a93;
            font-size: 14px;
        }

        /* ===== 控制区 ===== */
        .zyy-panel {
            background: #fff;
            border-radius: 14px;
            padding: 22px 26px;
            box-shadow: 0 6px 18px rgba(67, 48, 43, 0.08);
            margin-bottom: 22px;
        }

        .zyy-panel h2 {
            font-size: 18px;
            margin-bottom: 6px;
            border-left: 4px solid #c0392b;
            padding-left: 12px;
        }

        .zyy-panel > p.zyy-tip {
            font-size: 13px;
            color: #b59a93;
            margin-bottom: 16px;
            padding-left: 16px;
        }

        .zyy-run-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .zyy-btn {
            background: #c0392b;
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 10px 26px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .zyy-btn:hover {
            background: #96281b;
        }

        .zyy-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .zyy-btn.zyy-blue {
            background: #2b6cb0;
        }

        .zyy-btn.zyy-blue:hover {
            background: #1f5288;
        }

        .zyy-total {
            font-size: 14px;
            color: #2e7d32;
            font-weight: bold;
            min-height: 22px;
        }

        /* ===== 流程时间线 ===== */
        .zyy-steps {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .zyy-step {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            position: relative;
            padding-bottom: 26px;
        }

        .zyy-step:last-child {
            padding-bottom: 0;
        }

        /* 竖向连接线 */
        .zyy-step::before {
            content: "";
            position: absolute;
            left: 17px;
            top: 38px;
            bottom: 0;
            width: 2px;
            background: #f0dcd6;
        }

        .zyy-step:last-child::before {
            display: none;
        }

        .zyy-step-icon {
            flex: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f0dcd6;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            transition: all 0.3s;
            z-index: 1;
        }

        .zyy-step.zyy-running .zyy-step-icon {
            background: #e67e22;
            animation: zyy_pulse 1s infinite;
        }

        .zyy-step.zyy-done .zyy-step-icon {
            background: #27ae60;
        }

        @keyframes zyy_pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.18); }
        }

        .zyy-step-body {
            flex: 1;
            background: #fdf3ee;
            border: 1px solid #f0dcd6;
            border-radius: 10px;
            padding: 10px 16px;
        }

        .zyy-step.zyy-running .zyy-step-body {
            border-color: #e67e22;
            background: #fff7ef;
        }

        .zyy-step.zyy-done .zyy-step-body {
            border-color: #bfe6cd;
            background: #f2faf5;
        }

        .zyy-step-title {
            font-size: 15px;
            font-weight: bold;
        }

        .zyy-step.zyy-running .zyy-step-title {
            color: #d35400;
        }

        .zyy-step.zyy-done .zyy-step-title {
            color: #1e8449;
        }

        .zyy-step-desc {
            font-size: 13px;
            color: #a08b84;
        }

        .zyy-step-status {
            float: right;
            font-size: 12px;
            font-weight: bold;
            color: #b59a93;
        }

        .zyy-step.zyy-running .zyy-step-status {
            color: #d35400;
        }

        .zyy-step.zyy-done .zyy-step-status {
            color: #1e8449;
        }

        /* 并行子任务 */
        .zyy-sub-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .zyy-sub {
            flex: 1;
            min-width: 150px;
            font-size: 13px;
            background: #fff;
            border: 1px dashed #e5cfc8;
            border-radius: 8px;
            padding: 6px 12px;
            color: #a08b84;
        }

        .zyy-sub.zyy-running {
            border-color: #e67e22;
            color: #d35400;
            font-weight: bold;
        }

        .zyy-sub.zyy-done {
            border-style: solid;
            border-color: #bfe6cd;
            color: #1e8449;
            font-weight: bold;
        }

        /* ===== 日志区 ===== */
        .zyy-log {
            background: #2b211e;
            border-radius: 10px;
            padding: 16px 18px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.9;
            color: #d9c2bb;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .zyy-log .zyy-time { color: #8a746d; }
        .zyy-log .zyy-ok { color: #7dd6a0; }
        .zyy-log .zyy-hi { color: #f5b041; font-weight: bold; }
        .zyy-log .zyy-final { color: #f1948a; font-weight: bold; }

        .zyy-back {
            display: inline-block;
            margin-top: 26px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="zyy-container">
        <header class="zyy-header">
            <h1>Promise 与 async/await <span>包饺子流程演示</span></h1>
            <p>买原料（竞速）→ 取原料 → 和面+和馅（并行）→ 包饺子 → 煮饺子 → 吃饺子 · 张圆圆</p>
        </header>

        <!-- 控制按钮 -->
        <section class="zyy-panel">
            <h2>开始演示</h2>
            <p class="zyy-tip">setTimeout 模拟每个流程的耗时；同一流程可用 async/await 或纯 Promise 两种写法实现，结果完全一致。</p>
            <div class="zyy-run-row">
                <button class="zyy-btn" id="zyy_runAsync" onclick="zyy_runDemo(zyy_makeDumplingsAsync)">▶ async/await 写法运行</button>
                <button class="zyy-btn zyy-blue" id="zyy_runPromise" onclick="zyy_runDemo(zyy_makeDumplingsPromise)">▶ 纯 Promise 写法运行</button>
                <span class="zyy-total" id="zyy_total"></span>
            </div>
        </section>

        <!-- 流程时间线 -->
        <section class="zyy-panel">
            <h2>流程进度</h2>
            <p class="zyy-tip">灰色等待中 · 橙色跳动进行中 · 绿色已完成</p>
            <div class="zyy-steps" id="zyy_steps"></div>
        </section>

        <!-- 运行日志 -->
        <section class="zyy-panel">
            <h2>执行日志</h2>
            <p class="zyy-tip">每行记录当前时刻发生了什么（时间从演示开始累计）</p>
            <div class="zyy-log" id="zyy_log">等待开始演示…</div>
        </section>

        <a class="zyy-back" href="./index.html">← 返回首页</a>
    </div>

    <script>
        // ================= 流程定义 =================
        // 买原料：线上 6 秒、线下 4 秒，同时开始，完成任意一个即可（Promise.race 竞速）
        // 取原料 2 秒；和面 3 秒、和馅 4 秒（Promise.all 并行）；包饺子 3 秒；煮饺子 5 秒；吃饺子 1 秒
        var zyy_stepList = [
            { zyy_icon: "🛒", zyy_name: "① 买原料", zyy_desc: "线上（6s）与线下（4s）同时购买，先到先用 —— Promise.race 竞速", zyy_subs: ["线上下单 6s", "线下采购 4s"] },
            { zyy_icon: "📦", zyy_name: "② 取原料", zyy_desc: "把买到的面粉、肉馅、蔬菜取回家", zyy_subs: [] },
            { zyy_icon: "🌀", zyy_name: "③ 和面 + 和馅", zyy_desc: "两项同时进行，全部完成才能包 —— Promise.all 并行", zyy_subs: ["和面 3s", "和馅 4s"] },
            { zyy_icon: "🥟", zyy_name: "④ 包饺子", zyy_desc: "擀皮、放馅、捏褶，包出一盘饺子", zyy_subs: [] },
            { zyy_icon: "🍲", zyy_name: "⑤ 煮饺子", zyy_desc: "水开下锅，三点三次凉水", zyy_subs: [] },
            { zyy_icon: "😋", zyy_name: "⑥ 吃饺子", zyy_desc: "蘸醋开吃！", zyy_subs: [] }
        ];

        // ================= 状态渲染 =================
        var zyy_startTime = 0; // 演示开始时间戳

        // 渲染全部步骤（初始状态）
        function zyy_renderSteps() {
            var zyy_html = "";
            for (var zyy_i = 0; zyy_i < zyy_stepList.length; zyy_i++) {
                var zyy_s = zyy_stepList[zyy_i];
                zyy_html += '<div class="zyy-step" id="zyy_step_' + zyy_i + '">' +
                    '<div class="zyy-step-icon">' + zyy_s.zyy_icon + '</div>' +
                    '<div class="zyy-step-body">' +
                        '<div class="zyy-step-title">' + zyy_s.zyy_name +
                            '<span class="zyy-step-status" id="zyy_status_' + zyy_i + '">等待中</span>' +
                        '</div>' +
                        '<div class="zyy-step-desc">' + zyy_s.zyy_desc + '</div>';
                if (zyy_s.zyy_subs.length > 0) {
                    zyy_html += '<div class="zyy-sub-row">';
                    for (var zyy_j = 0; zyy_j < zyy_s.zyy_subs.length; zyy_j++) {
                        zyy_html += '<div class="zyy-sub" id="zyy_sub_' + zyy_i + '_' + zyy_j + '">' + zyy_s.zyy_subs[zyy_j] + '</div>';
                    }
                    zyy_html += '</div>';
                }
                zyy_html += '</div></div>';
            }
            document.getElementById("zyy_steps").innerHTML = zyy_html;
        }

        // 步骤状态切换：状态值 waiting / running / done
        function zyy_setStep(zyy_index, zyy_state, zyy_text) {
            var zyy_el = document.getElementById("zyy_step_" + zyy_index);
            zyy_el.className = "zyy-step zyy-" + zyy_state;
            document.getElementById("zyy_status_" + zyy_index).textContent = zyy_text;
        }

        // 子任务状态切换
        function zyy_setSub(zyy_stepIndex, zyy_subIndex, zyy_state) {
            document.getElementById("zyy_sub_" + zyy_stepIndex + "_" + zyy_subIndex).className =
                "zyy-sub zyy-" + zyy_state;
        }

        // 追加日志
        function zyy_log(zyy_text, zyy_cls) {
            var zyy_sec = Math.floor((new Date().getTime() - zyy_startTime) / 1000);
            var zyy_line = document.createElement("span");
            zyy_line.innerHTML = '[<span class="zyy-time">' + zyy_sec + 's</span>] <span class="' +
                (zyy_cls || "zyy-ok") + '">' + zyy_text + "</span>\n";
            var zyy_box = document.getElementById("zyy_log");
            zyy_box.appendChild(zyy_line);
            zyy_box.scrollTop = zyy_box.scrollHeight;
        }

        // ================= 异步工具 =================
        // 用 setTimeout 模拟一个耗时流程，返回 Promise
        function zyy_sleep(zyy_ms) {
            return new Promise(function (zyy_resolve) {
                setTimeout(zyy_resolve, zyy_ms);
            });
        }

        // ================= 演示入口 =================
        function zyy_runDemo(zyy_fn) {
            document.getElementById("zyy_runAsync").disabled = true;
            document.getElementById("zyy_runPromise").disabled = true;
            zyy_renderSteps();
            zyy_startTime = new Date().getTime();
            var zyy_logBox = document.getElementById("zyy_log");
            zyy_logBox.innerHTML = "";
            zyy_log("======= 演示开始（" + (zyy_fn === zyy_makeDumplingsAsync ? "async/await" : "纯 Promise") + " 写法）=======", "zyy-hi");

            zyy_fn().then(function () {
                var zyy_sec = Math.floor((new Date().getTime() - zyy_startTime) / 1000);
                zyy_log("======= 全流程结束，总耗时约 " + zyy_sec + " 秒 =======", "zyy-final");
                document.getElementById("zyy_total").textContent = "✅ 全流程完成，总耗时约 " + zyy_sec + " 秒";
                document.getElementById("zyy_runAsync").disabled = false;
                document.getElementById("zyy_runPromise").disabled = false;
            });
        }

        // ============ 写法一：async / await ============
        async function zyy_makeDumplingsAsync() {
            // ① 买原料：线上线下同时购买，完成任意一个即可 —— Promise.race
            zyy_setStep(0, "running", "进行中");
            zyy_log("🛒 线上（6s）和线下（4s）同时开始买原料…");
            zyy_setSub(0, 0, "running");
            zyy_setSub(0, 1, "running");

            var zyy_online = zyy_sleep(6000).then(function () { return "线上"; });
            var zyy_offline = zyy_sleep(4000).then(function () { return "线下"; });

            var zyy_winner = await Promise.race([zyy_online, zyy_offline]);
            zyy_setSub(zyy_winner === "线下" ? 0 : 1, zyy_winner === "线下" ? 1 : 0, "done");
            zyy_setSub(zyy_winner === "线下" ? 1 : 0, zyy_winner === "线下" ? 0 : 1, "done");
            zyy_log("🛒 " + zyy_winner + "渠道先买到了原料，不再等另一边（race 竞速）", "zyy-hi");
            zyy_setStep(0, "done", "完成");

            // ② 取原料
            zyy_setStep(1, "running", "进行中");
            zyy_log("📦 开始取原料…");
            await zyy_sleep(2000);
            zyy_setStep(1, "done", "完成");
            zyy_log("📦 原料已取回厨房");

            // ③ 和面 + 和馅：同时进行，全部完成 —— Promise.all
            zyy_setStep(2, "running", "进行中");
            zyy_log("🌀 和面（3s）与和馅（4s）同时开始…");
            zyy_setSub(2, 0, "running");
            zyy_setSub(2, 1, "running");

            var zyy_dough = zyy_sleep(3000).then(function () {
                zyy_setSub(2, 0, "done");
                zyy_log("🌀 和面完成");
            });
            var zyy_filling = zyy_sleep(4000).then(function () {
                zyy_setSub(2, 1, "done");
                zyy_log("🌀 和馅完成");
            });
            await Promise.all([zyy_dough, zyy_filling]);

            zyy_log("🌀 面和馅都准备好了（Promise.all 汇合）", "zyy-hi");
            zyy_setStep(2, "done", "完成");

            // ④ 包饺子
            zyy_setStep(3, "running", "进行中");
            zyy_log("🥟 开始包饺子…");
            await zyy_sleep(3000);
            zyy_setStep(3, "done", "完成");
            zyy_log("🥟 一盘饺子包好了");

            // ⑤ 煮饺子
            zyy_setStep(4, "running", "进行中");
            zyy_log("🍲 水开下锅煮饺子…");
            await zyy_sleep(5000);
            zyy_setStep(4, "done", "完成");
            zyy_log("🍲 饺子煮好了，浮起来了！");

            // ⑥ 吃饺子
            zyy_setStep(5, "running", "进行中");
            zyy_log("😋 开吃！蘸醋更香~");
            await zyy_sleep(1000);
            zyy_setStep(5, "done", "完成");
            zyy_log("😋 吃饺子结束，满足！", "zyy-hi");
        }

        // ============ 写法二：纯 Promise 链 ============
        function zyy_makeDumplingsPromise() {
            // ① 买原料（race 竞速）
            zyy_setStep(0, "running", "进行中");
            zyy_log("🛒 线上（6s）和线下（4s）同时开始买原料…");
            zyy_setSub(0, 0, "running");
            zyy_setSub(0, 1, "running");

            var zyy_online = zyy_sleep(6000).then(function () { return "线上"; });
            var zyy_offline = zyy_sleep(4000).then(function () { return "线下"; });

            return Promise.race([zyy_online, zyy_offline])
                .then(function (zyy_winner) {
                    zyy_setSub(0, 0, "done");
                    zyy_setSub(0, 1, "done");
                    zyy_log("🛒 " + zyy_winner + "渠道先买到了原料，不再等另一边（race 竞速）", "zyy-hi");
                    zyy_setStep(0, "done", "完成");
                    // ② 取原料
                    zyy_setStep(1, "running", "进行中");
                    zyy_log("📦 开始取原料…");
                    return zyy_sleep(2000);
                })
                .then(function () {
                    zyy_setStep(1, "done", "完成");
                    zyy_log("📦 原料已取回厨房");
                    // ③ 和面 + 和馅（all 并行）
                    zyy_setStep(2, "running", "进行中");
                    zyy_log("🌀 和面（3s）与和馅（4s）同时开始…");
                    zyy_setSub(2, 0, "running");
                    zyy_setSub(2, 1, "running");
                    return Promise.all([
                        zyy_sleep(3000).then(function () {
                            zyy_setSub(2, 0, "done");
                            zyy_log("🌀 和面完成");
                        }),
                        zyy_sleep(4000).then(function () {
                            zyy_setSub(2, 1, "done");
                            zyy_log("🌀 和馅完成");
                        })
                    ]);
                })
                .then(function () {
                    zyy_log("🌀 面和馅都准备好了（Promise.all 汇合）", "zyy-hi");
                    zyy_setStep(2, "done", "完成");
                    // ④ 包饺子
                    zyy_setStep(3, "running", "进行中");
                    zyy_log("🥟 开始包饺子…");
                    return zyy_sleep(3000);
                })
                .then(function () {
                    zyy_setStep(3, "done", "完成");
                    zyy_log("🥟 一盘饺子包好了");
                    // ⑤ 煮饺子
                    zyy_setStep(4, "running", "进行中");
                    zyy_log("🍲 水开下锅煮饺子…");
                    return zyy_sleep(5000);
                })
                .then(function () {
                    zyy_setStep(4, "done", "完成");
                    zyy_log("🍲 饺子煮好了，浮起来了！");
                    // ⑥ 吃饺子
                    zyy_setStep(5, "running", "进行中");
                    zyy_log("😋 开吃！蘸醋更香~");
                    return zyy_sleep(1000);
                })
                .then(function () {
                    zyy_setStep(5, "done", "完成");
                    zyy_log("😋 吃饺子结束，满足！", "zyy-hi");
                });
        }

        // 初始化渲染
        zyy_renderSteps();
    </script>
</body>
</html>
